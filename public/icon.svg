<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#27272a" stroke-width="8" stroke-dasharray="12 12" />
  
  <!-- Dumbbell / Evolution Wings Logo -->
  <g transform="translate(256,256) scale(1.15)">
    <!-- Central Bar -->
    <rect x="-100" y="-12" width="200" height="24" rx="12" fill="url(#accent)" filter="url(#glow)"/>
    <rect x="-30" y="-14" width="60" height="28" rx="6" fill="#ffffff" opacity="0.3"/>
    
    <!-- Left Weight Plates -->
    <rect x="-124" y="-55" width="24" height="110" rx="10" fill="url(#accent)"/>
    <rect x="-146" y="-75" width="18" height="150" rx="8" fill="url(#accent)" opacity="0.9"/>
    <rect x="-160" y="-45" width="10" height="90" rx="5" fill="#a7f3d0"/>
    
    <!-- Right Weight Plates -->
    <rect x="100" y="-55" width="24" height="110" rx="10" fill="url(#accent)"/>
    <rect x="128" y="-75" width="18" height="150" rx="8" fill="url(#accent)" opacity="0.9"/>
    <rect x="150" y="-45" width="10" height="90" rx="5" fill="#a7f3d0"/>
    
    <!-- Upward Evolution Arrow / Lightning Peak -->
    <path d="M -24 -36 L 0 -84 L 24 -36 Z" fill="#22c55e" filter="url(#glow)"/>
    <path d="M 0 -84 L 0 -16" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
